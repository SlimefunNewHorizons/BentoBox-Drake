<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">BentoBox for DrakesCraft</title>
  <desc id="desc">Amethyst space banner for the maintained DrakesCraft BentoBox build.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09051a"/>
      <stop offset="0.52" stop-color="#24104d"/>
      <stop offset="1" stop-color="#090b24"/>
    </linearGradient>
    <linearGradient id="amethyst" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bd7cff"/>
      <stop offset="0.5" stop-color="#f0ccff"/>
      <stop offset="1" stop-color="#6ee7ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#space)"/>
  <g fill="#ffffff" opacity=".55">
    <circle cx="74" cy="54" r="1.8"/><circle cx="182" cy="238" r="1.2"/><circle cx="350" cy="49" r="1.4"/>
    <circle cx="702" cy="65" r="1.7"/><circle cx="914" cy="231" r="1.3"/><circle cx="1127" cy="73" r="1.9"/>
  </g>
  <g transform="translate(82 58)" fill="none" stroke="url(#amethyst)" stroke-width="5" filter="url(#glow)">
    <path d="M92 0 184 48v96l-92 48L0 144V48Z"/>
    <path d="m0 48 92 48 92-48M92 96v96" opacity=".78"/>
    <path d="m55 67 37-20 37 20-37 20Z" opacity=".62"/>
  </g>
  <text x="320" y="133" fill="url(#amethyst)" font-family="Inter,Segoe UI,sans-serif" font-size="66" font-weight="800" letter-spacing="1">BENTOBOX</text>
  <text x="324" y="181" fill="#d8c7f7" font-family="Inter,Segoe UI,sans-serif" font-size="24" letter-spacing="8">DRAKESCRAFT MAINTAINED BUILD</text>
  <path d="M324 211h680" stroke="url(#amethyst)" stroke-width="3" opacity=".75"/>
  <text x="324" y="246" fill="#9ea9ce" font-family="Inter,Segoe UI,sans-serif" font-size="18">Stable persistence · focused regression tests · auditable releases</text>
</svg>
